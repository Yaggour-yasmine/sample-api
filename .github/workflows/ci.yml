name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: sample-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Une seule construction : l'image scannée par Trivy est exactement celle qui est poussée.
  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build de l'image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .
      - name: Scan de l'image avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      # Les étapes suivantes ne tournent que sur main (registre GHCR, gratuit)
      - name: Connexion à GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push vers GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/$IMAGE_NAME:${{ github.sha }}
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE
          docker push $IMAGE

  update-gitops:
    if: github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    # Un seul déploiement à la fois : évite les conflits de push sur platform-gitops
    concurrency:
      group: gitops-sample-api-dev
      cancel-in-progress: false
    steps:
      - name: Mise à jour du dépôt GitOps (env dev)
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/${{ github.repository_owner }}/platform-gitops.git
          cd platform-gitops
          sed -i "s|tag:.*|tag: \"${{ github.sha }}\"|" apps/sample-api/envs/dev/values.yaml
          if git diff --quiet; then
            echo "Aucun changement à déployer."
            exit 0
          fi
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git commit -am "chore(sample-api): déploie ${{ github.sha }} en dev"
          # Nouvelle tentative si un autre commit est arrivé entre-temps
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 3
          done
          exit 1
